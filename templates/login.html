{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px; border-top: 5px solid #6a1b9a;">
    <h3 class="text-center mb-4" style="color: #6a1b9a;">🔑 Login to GSRA</h3>

    <!-- Flash messages for errors (e.g., invalid credentials) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-3">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" id="password" placeholder="••••••••" required>
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="showPassword">
          <label class="form-check-label" for="showPassword">Show Password</label>
        </div>
      </div>
      <button class="btn w-100" style="background-color: #6a1b9a; color: white;">Login</button>
    </form>

    <div class="mt-3 text-center">
      <a href="{{ url_for('forgot') }}" class="text-decoration-none" style="color: #6a1b9a;">Forgot Password?</a><br>
      <span class="text-muted">No account?</span>
      <a href="{{ url_for('signup') }}" class="text-decoration-none" style="color: #6a1b9a;">Sign up</a>
    </div>
  </div>
</div>

<script>
document.getElementById("showPassword").addEventListener("click", function () {
  const pwd = document.getElementById("password");
  pwd.type = this.checked ? "text" : "password";
});
</script>
{% endblock %}
