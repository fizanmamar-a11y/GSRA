{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h3 class="mb-4" style="color:#6a1b9a;">🔔 Notifications</h3>

  {% if messages and messages|length > 0 %}
    <ul class="list-group">
      {% for msg in messages %}
        <li class="list-group-item">{{ msg[0] }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <div class="alert alert-info mt-3" role="alert">
      No notifications yet. Stay tuned!
    </div>
  {% endif %}

  <div class="mt-3">
    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary">⬅ Back to Dashboard</a>
  </div>
</div>
{% endblock %}
