{% extends "base.html" %}
{% block content %}
<div class="container py-4">

  <!-- Forum Header -->
  <div class="text-center mb-4">
    <h3 style="color:#6a1b9a; font-weight:700;">Forum Thread</h3>
    <p class="text-muted">Discuss and share your thoughts</p>
  </div>

  <!-- Add New Post -->
  <div class="dashboard-card mb-4">
    <form method="POST" class="d-flex gap-3">
      <input type="text" name="content" class="form-control" placeholder="Write your reply..." required>
      <button type="submit" class="btn btn-primary">Post</button>
    </form>
  </div>

  <!-- Posts Section -->
  <div class="d-flex flex-column gap-3">
    {% for content, timestamp in posts %}
    <div class="dashboard-card">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span style="font-size:1.2rem; color:#6a1b9a;">🗨️</span>
        <small class="text-muted">{{ timestamp }}</small>
      </div>
      <p>{{ content }}</p>
    </div>
    {% else %}
    <div class="dashboard-card text-center">
      <p class="text-muted">No posts yet. Be the first to reply!</p>
    </div>
    {% endfor %}
  </div>

</div>
{% endblock %}
