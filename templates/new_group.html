{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h3 class="mb-4" style="color:#6a1b9a;">➕ Create New Group</h3>

  <!-- Flash messages for success/error -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mb-3">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form class="mt-3" method="POST" action="{{ url_for('new_group') }}">
    <div class="mb-3">
      <label class="form-label fw-semibold">Group Name</label>
      <input type="text" class="form-control" name="name" placeholder="Enter group name" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Description</label>
      <textarea class="form-control" name="description" rows="3" placeholder="Describe the group"></textarea>
    </div>
    <button class="btn btn-primary w-100">Create Group</button>
  </form>

  <div class="mt-3">
    <a href="{{ url_for('groups') }}" class="btn btn-outline-secondary">⬅ Back to Groups</a>
  </div>
</div>
{% endblock %}
