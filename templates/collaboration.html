{% extends "base.html" %}
{% block content %}
<div class="container py-4">

  <!-- Collaboration Header -->
  <div class="text-center mb-4">
    <h3 style="color:#6a1b9a; font-weight:700;">Collaboration Workspace</h3>
    <p class="text-muted">Share notes, tasks, and ideas with your peers</p>
  </div>

  <!-- Add New Note -->
  <div class="dashboard-card mb-4">
    <form method="POST" class="d-flex gap-3">
      <input type="text" name="note" class="form-control" placeholder="Type your note here..." required>
      <button type="submit" class="btn btn-primary">Add Note</button>
    </form>
  </div>

  <!-- Notes Section -->
  <div class="row g-4">
    {% for note, timestamp in notes %}
    <div class="col-md-6">
      <div class="dashboard-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span style="font-size:1.2rem; color:#6a1b9a;">📝</span>
          <small class="text-muted">{{ timestamp }}</small>
        </div>
        <p>{{ note }}</p>
      </div>
    </div>
    {% else %}
    <div class="col-12">
      <div class="dashboard-card text-center">
        <p class="text-muted">No collaboration notes yet. Start by adding one above!</p>
      </div>
    </div>
    {% endfor %}
  </div>

</div>
{% endblock %}
