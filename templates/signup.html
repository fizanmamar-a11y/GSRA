{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="height: 80vh;">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px; border-top: 5px solid #6a1b9a;">
    <h3 class="text-center mb-4" style="color: #6a1b9a;">📝 Sign Up</h3>

    <!-- Flash messages for errors (e.g., duplicate email) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-3">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('signup') }}">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" placeholder="Choose a strong password" required>
      </div>
      <button class="btn w-100" style="background-color: #6a1b9a; color: white;">Sign Up</button>
    </form>

    <div class="mt-3 text-center">
      <span class="text-muted">Already have an account?</span>
      <a href="{{ url_for('login') }}" style="color: #6a1b9a;">Login</a>
    </div>
  </div>
</div>
{% endblock %}
