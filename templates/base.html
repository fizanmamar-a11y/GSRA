<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light" style="background-color:#ede7f6; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">GSRA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">🏠 Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('groups') }}">👥 Groups</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('forums') }}">💬 Forums</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('progress') }}">📈 Progress</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('reading_list') }}">📖 Reading List</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('collaboration') }}">🛠️ Collaboration</a></li>
        </ul>

        <ul class="navbar-nav ms-auto">
          {% if session.get('user') %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('profile') }}">👤 Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('notifications') }}">🔔 Notifications</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="{{ url_for('logout') }}">🚪 Logout</a></li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">🔑 Login</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('signup') }}">📝 Sign Up</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Floating Action Button with Tooltip -->
  <a href="{{ url_for('groups') }}" class="fab" data-bs-toggle="tooltip" data-bs-placement="left" title="Create New Group">+</a>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Activate Bootstrap tooltips
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl)
    })
  </script>
</body>
</html>
